# L2D 控制系统 Phase 2 — config.yaml 示例
# 复制为 config.yaml 并按需修改；字段可缺省，缺省时回退环境变量与默认值。
# 解析优先级：config.yaml > 环境变量 > 默认值
# 借鉴 SoulLink_Live2D src/config/manager.py 的字段级继承：
#   llm.chat 缺省字段自动继承 llm.api（模型、baseUrl、temperature 等）。

server:
  host: 0.0.0.0
  port: 3000
  path: /ws

# LLM（OpenAI 兼容接口）
llm:
  api:
    apiKey: ""                       # 为空则启用 mock 模式
    baseUrl: https://api.openai.com/v1
    model: gpt-4o-mini
    temperature: 0.2                 # 0.1~0.3 保证输出一致性（表情控制）
    timeout: 60
    jsonMode: false                  # 服务端支持时设为 true 强制 JSON 输出
    maxTokens: 0                     # 0 = 不限制
  # 对话专用配置：缺省字段继承 llm.api
  chat:
    model: gpt-4o-mini               # 对话/情绪一体化调用使用的模型
    temperature: 0.2

# TTS：mock | edge-tts | openai（OpenAI 兼容 POST {baseUrl}/audio/speech → mp3）
tts:
  engine: mock
  voice: zh-CN-XiaoxiaoNeural        # edge-tts 发音人；openai 引擎默认 alloy
  rate: +0%                          # 仅 edge-tts
  baseUrl: https://api.openai.com/v1 # openai 引擎
  apiKey: ""                         # openai 引擎必需
  model: tts-1                       # openai 引擎模型
  speed: 1.0                         # openai 引擎语速 0.25~4.0
  sampleRate: 24000                  # mock 引擎采样率

# Live2D 模型目录（model_scanner 扫描；相对本目录的路径）
model:
  directory: ../assets/models
